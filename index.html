<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
彩票智能分析系统 V35.9.2 Mobile
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
彩票智能分析系统 V35.9.2 Mobile
</h1>



<div class="box">

<div class="title">
数据状态
</div>


大乐透历史数据：

<span id="dltStatus">
等待加载
</span>


<br>


数据期数：

<span id="dataCount">
0
</span>


</div>





<button id="predictBtn">

开始 V35.9.2 智能分析

</button>



<button id="backTestBtn">

历史回测分析

</button>







<div class="box">


<div class="title">
预测结果
</div>


<div id="result">

等待分析...

</div>


</div>







<div class="box">


<div class="title">
历史回测报告
</div>


<div id="backTestResult">

等待回测...

</div>


</div>







<div class="box">


<div class="title">
开奖反馈输入
</div>



<input

id="realResult"

placeholder="例如：03 08 17 26 33 + 07 10"

>




<button id="feedbackBtn">

保存开奖反馈

</button>


</div>







<div class="box">


<div class="title">
学习状态
</div>


<div id="learningStatus">

等待开奖反馈学习

</div>


</div>







<div class="box">


<div class="title">
系统状态
</div>


<div id="systemStatus">

V35.9.2 Mobile等待启动

</div>


</div>






</div>







<script src="engine.js"></script>

<script src="script.js"></script>


</body>

</html>
