<h3>

<h3>
AI会议 / 自我分析
</h3>



<div id="meeting">

等待分析

期号：

<script src="js/database.js"></script>

<script src="js/learning.js"></script>

<script src="js/model.js"></script>

<script src="js/app.js"></script>



<script>


// 显示数据数量

setInterval(()=>{


if(window.V90Database){


document.getElementById(
"dataCount"
).innerHTML=

V90Database.count()+"期";


}


},1000);



// 历史训练按钮

document.getElementById(
"trainBtn"
).onclick=

async()=>{


let result=

await V90Training.run(500);



let box=

document.getElementById(
"trainResult"
);



box.innerHTML=

`

训练完成

<br>

次数：

${result.total}

<br>

前区3+：

${result.front3}

<br>

后区命中：

${result.back1}

`;



V90Learning.train(

V90Training.records()

);



V90Report.show();



};



</script>
