<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
大乐透 AI CORE V1.1
</title>

<link rel="stylesheet" href="css/app.css">

</head>


<body>


<div class="container">


<h1>
大乐透 AI CORE V1.1
</h1>



<div class="card">

<h2>
数据状态
</h2>

<div id="dataStatus">
等待加载
</div>

</div>





<div class="card">


<h2>
AI分析中心
</h2>


<button id="analyzeBtn">
开始 AI 分析
</button>


<button id="trainBtn">
滚动训练
</button>


<div id="trainStatus">
等待训练...
</div>


</div>







<div class="card">


<h2>
预测结果
</h2>


<div id="prediction">
等待分析...
</div>


</div>







<div class="card">


<h2>
AI成长报告
</h2>


<div id="report">
暂无报告
</div>


</div>



</div>





<script src="js/config.js"></script>

<script src="js/database.js"></script>

<script src="js/parser.js"></script>

<script src="js/models.js"></script>

<script src="js/predictor.js"></script>

<script src="js/montecarlo.js"></script>

<script src="js/training.js"></script>

<script src="js/feedback.js"></script>

<script src="js/report.js"></script>

<script src="js/engine.js"></script>

<script src="js/ui.js"></script>




<script>


fetch("data/dlt.txt")

.then(r=>r.text())

.then(text=>{


let info=

DLT_ENGINE.init(text);



DLT_UI.set(

"dataStatus",

"历史数据："+info.count+"期"

);



});





document.getElementById(
"analyzeBtn"
).onclick=async()=>{


DLT_UI.set(

"prediction",

"计算中..."

);



let result=

await DLT_ENGINE.analyze();



DLT_UI.showPrediction(result);



};







document.getElementById(
"trainBtn"
).onclick=()=>{


DLT_ENGINE.train(

(num)=>{


DLT_UI.progress(num);



}

);



};



</script>



</body>

</html>
