<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>
大乐透 AI CORE
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="container">


<h1>
大乐透 AI CORE V1.0
</h1>



<div class="card">


<h2>
系统状态
</h2>


<p id="status">
等待连接...
</p>


</div>





<div class="card">


<button id="start">

开始 AI 分析

</button>



</div>







<div class="card">


<h2>
预测结果 TOP10
</h2>


<div id="result">

等待分析...

</div>


</div>







<div class="card">


<h2>
开奖反馈
</h2>


<input
id="issue"
placeholder="期号"
/>


<input
id="front"
placeholder="前区 例如 01 05 12 20 33"
/>


<input
id="back"
placeholder="后区 例如 03 11"
/>



<button id="feedback">

提交反馈

</button>



</div>



</div>





<script src="app.js"></script>


</body>


</html>
